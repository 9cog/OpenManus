[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Skip sandbox integration tests by default (require Docker daemon).
# Run them explicitly with: pytest tests/sandbox/
addopts = --ignore=tests/sandbox
# Suppress noisy deprecation warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    ignore::UserWarning:pydantic.*
